project:
  name: "Kpneumoniae-Transmission-Analysis-Facility-ST-TEST"
  run_id: null

inputs:
  metadata: "data/kpneumoniae/hospital_c/hospital_c_metadata_kpneumo.csv"
  snp_matrix: "data/kpneumoniae/hospital_c/hospital_c_snpdist_kpneumo.csv"
  mlst_profile: "data/kpneumoniae/hospital_c/hospital_c_metadata_kpneumo.csv"

columns:
  sample_id: sampleid
  sequence_type: st_type #ST
  st_sample_id: sampleid #strain # FILE

variables:
  main_var: hospital
  var_01: ward_type
  var_02: specimen_collection_date #TakenDate

analysis:
  cluster_type: "Transmission"        # Core or Transmission
  transmission_level: "Facility"      # Facility, Area, Community
  core_cluster_context: [MainVar,ST] 
  snp_cutoff: 11
  days_cutoff: 14
  n_bootstraps: 500
  random_seed: 42
  date_format: "mdy" # "ymd"
  max_k: null
  engine: r_compatible


outputs:
  out_dir: "runs"
  generate_excel: true
  generate_figures: true
  generate_html_report: true
