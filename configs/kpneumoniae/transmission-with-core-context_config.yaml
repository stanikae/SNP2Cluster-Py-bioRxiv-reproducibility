project:
  name: "Kpneumoniae-Transmission-Analysis-Facility-ST-context-aware"
  run_id: null

inputs:
  metadata: "/Users/stan/GitHub/snp2cluster-py-public/biorxiv/data/bgerms_study_metadata_klepp.csv"
  snp_matrix: "/Users/stan/GitHub/snp2cluster-py-public/biorxiv/data/klepp-snp-matrices/klepp-combined_coreSNPmatrix.co.csv"
  mlst_profile: "/Users/stan/GitHub/snp2cluster-py-public/biorxiv/data/bgerms_study_metadata_klepp.csv"

columns:
  sample_id: sampleid
  sequence_type: st_type #ST
  st_sample_id: sampleid #strain # FILE

variables:
  main_var: hospital
